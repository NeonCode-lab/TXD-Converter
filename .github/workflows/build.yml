name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Siapkan keystore (opsional)
      - name: Diagnosa keystore
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Panjang KEYSTORE_PASSWORD: ${#KEYSTORE_PASSWORD}"
          echo "Panjang KEY_PASSWORD: ${#KEY_PASSWORD}"
          [ "$KEYSTORE_PASSWORD" = "$KEY_PASSWORD" ] && echo "Dua password SAMA" || echo "Dua password BEDA"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" | grep -E "Keystore type|SHA256"
          keytool -importkeystore -srckeystore "$KEYSTORE_FILE" -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" -destkeystore "$RUNNER_TEMP/tes.p12" -deststoretype pkcs12 -deststorepass tes123456 -noprompt && echo "KUNCI BISA DIBUKA"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Keystore stabil dipakai"
          else
            echo "Secret KEYSTORE_BASE64 kosong: pakai kunci debug bawaan"
          fi
      - run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: TXD-Studio-debug, path: app/build/outputs/apk/debug/app-debug.apk }
